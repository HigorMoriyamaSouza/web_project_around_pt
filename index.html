<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <meta name="author" content="Higor Moriyama Souza" />
    <meta name="description" content="A responsive front-end web project built with HTML5, CSS3, and JavaScript." />
    <meta name="keywords" content="Social Media, Photos, Posts" />
    <title>Around The U.S.</title>
    <link rel="shortcut icon" href="./images/logo.svg" />
    <link href="./pages/index.css" rel="stylesheet" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="./images/logo.svg"
        />
      </header>

      <main class="content">
        <section class="profile page__section">
          <div class="profile__image-container">
            <img class="profile__image" src="" alt="Avatar" />
          </div>
          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <button
              aria-label="Editar perfil"
              class="profile__edit-button"
              type="button"
            ></button>
            <p class="profile__description"></p>
          </div>
            <button
              aria-label="Adicionar cartão"
              class="profile__add-button"
              type="button"
            ></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>

      <footer class="footer page__section">
        <p class="footer__copyright">© 2026 Around The U.S.</p>
      </footer>

      <!--EDIT PROFILE POPUP-->
      <div class="popup" id="edit-popup">
        <div class="popup__content">
          <button
            aria-label="Fechar pop-up"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Edit profile</h3>
          <form class="popup__form" id="edit-profile-form">
            <input
              class="popup__input popup__input_type_name"
              minlength="2"
              maxlength="40"
              name="name"
              placeholder="Name"
              type="text"
              required
            />
            <span class="popup__input-error name-input-error"></span>
            <input
              class="popup__input popup__input_type_description"
              minlength="2"
              maxlength="200"
              name="description"
              placeholder="About me"
              type="text"
              required
            />
            <span class="popup__input-error description-input-error"></span>
            <button class="button popup__button" type="submit">Save</button>
          </form>
        </div>
      </div>
      <!--EDIT PROFILE POPUP-->

      <!--POPUP EDIT AVATAR-->
      <div class="popup" id="edit-avatar-popup">
        <div class="popup__content">
          <button
            aria-label="Fechar pop-up"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Edit Avatar</h3>
          <form class="popup__form" id="edit-avatar-form">
            <input
              class="popup__input popup__input-avatar popup__input_type_url"
              name="link"
              placeholder="Avatar link"
              required
              type="url"
            />
            <span class="popup__input-error link-input-error"></span>
            <button class="button popup__button" type="submit">Save</button>
          </form>
        </div>
      </div>
      <!--POPUP EDIT AVATAR-->

      <!--NEW CARD POPUP-->
      <div class="popup" id="new-card-popup">
        <div class="popup__content">
          <button
            aria-label="Fechar pop-up"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">New place</h3>
          <form class="popup__form" id="new-card-form">
            <input
              class="popup__input popup__input_type_card-name"
              name="place-name"
              placeholder="Title"
              minlength="2"
              maxlength="30"
              required
              type="text"
            />
            <span class="popup__input-error place-name-input-error"></span>
            <input
              class="popup__input popup__input_type_url"
              name="link"
              placeholder="Image link"
              required
              type="url"
            />
            <span class="popup__input-error link-input-error"></span>
            <button class="button popup__button" type="submit">Create</button>
          </form>
        </div>
      </div>
      <!--NEW CARD POPUP-->

      <!--DELETE CARD POPUP-->
      <div class="popup" id="delete-card-popup">
        <div class="popup__content popup__delete-card">
          <button
            aria-label="Fechar pop-up"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Are you sure?</h3>
          <button class="button popup__button popup__button_type_confirm-delete" type="button">Yes</button>
        </div>
      </div>
      <!--DELETE CARD POPUP-->

      <!--CARD IMAGE POPUP-->
      <div class="popup" id="image-popup">
        <div class="popup__content popup__content_content_image">
          <button
            aria-label="Fechar pop-up"
            class="popup__close"
            type="button"
          ></button>
          <img alt="" class="popup__image" src="#" />
          <p class="popup__caption"></p>
        </div>
      </div>
      <!--CARD IMAGE POPUP-->
    </div>

    <!--CARD TEMPLATE-->
    <template id="cards-template">
      <li class="card">
        <img
          class="card__image"
          src=""
          alt=""
        />
        <button
          aria-label="Excluir cartão"
          class="card__delete-button"
          type="button"
        ></button>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button
            aria-label="Botão de curtir"
            class="card__like-button"
            type="button"
          ></button>
        </div>
      </li>
    </template>
    <!--CARD TEMPLATE-->

    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
